buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.16.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.69.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.22.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.81.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.23.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.2.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.65.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.26.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.1.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.7.0'
        classpath 'com.palantir.metricschema:gradle-metric-schema:0.33.0'
        classpath 'org.revapi:gradle-revapi:1.8.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'
apply plugin: 'com.palantir.failure-reports'

javaVersions {
    libraryTarget = 17
    runtime = 25
}

version gitVersion()

allprojects {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.baseline-null-away'
    apply plugin: 'com.palantir.jakarta-package-alignment'

    group 'com.palantir.deadlines'
    version System.env.CIRCLE_TAG ?: rootProject.version

    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            includeEngines 'jqwik', 'junit-jupiter'
        }
    }
}

jdks {
    daemonTarget = 21
}
