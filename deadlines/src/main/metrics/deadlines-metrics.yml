options:
  javaPackage: com.palantir.deadlines
  javaVisibility: packagePrivate
namespaces:
  deadline:
    docs: Metrics for deadlines.
    metrics:
      expired:
        type: meter
        tags:
          - name: cause
            values:
              - value: internal
                docs: A deadline expiration was caused by an internal process, such as
                      a server's inability to meet its own internal deadline even though
                      a client provided ample time.
              - value: external
                docs: A deadline expiration was caused due to the inability to meet an 
                      externally provided deadline, such as a server being unable to
                      complete required work before a client-provided deadline elapses.
          - name: intent
            docs: Describes the intent (or not) to propagate an expired deadline on
                 further RPC calls.
            values:
              - value: throw
                docs: Enforcement was enabled for this trace at the time the deadline
                      expiration was reached, and an exception was thrown.
              - value: propagate
                docs: Deadline propagation was enabled for this trace at the time
                      the deadline expiration was reached. This means that further
                      RPC calls will still potentially propagate an expired deadline
                      value.
              - value: propagate-already-expired
                docs: Deadline propagation was enabled for this trace, but the deadline
                      had already expired by the time it was first received.
              - value: ignore
                docs: Deadline propagation was disabled for this trace at the time
                      the deadline expiration was reached. This means that further
                      RPC calls will not propagate an expired deadline value any more.
        docs: Marked every time a deadline expiration is reached
      expired.budget:
        type: histogram
        docs: Records the original deadline budget (in nanoseconds) that was provided
              to this service at the time of a deadline expiration.
