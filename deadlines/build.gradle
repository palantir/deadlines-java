apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.metric-schema'
apply plugin: 'org.revapi.revapi-gradle-plugin'

dependencies {
    implementation 'com.google.code.findbugs:jsr305'
    implementation 'com.palantir.tracing:tracing'
    implementation 'io.dropwizard.metrics:metrics-core'
    implementation 'com.palantir.tritium:tritium-metrics'
    implementation 'com.palantir.safe-logging:logger'
    implementation 'com.palantir.safe-logging:safe-logging'

    // for VisibleForTesting annotation
    compileOnly "com.google.guava:guava"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.assertj:assertj-core"
    testImplementation 'net.jqwik:jqwik-api'

    testRuntimeOnly 'net.jqwik:jqwik'
}

